[project]
name = "backend"
version = "0.1.0"
description = "Backend API exposing monorepo packages as features"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "json-log-formatter>=1.1.1",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.13.2",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi-monorepo-workspace"]
